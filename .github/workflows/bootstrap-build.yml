name: Bootstrap and Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rebuild source tree
        shell: bash
        run: |
          base64 -d project.b64 > OsmusGallery.zip
          unzip -q OsmusGallery.zip -d rebuilt
          cp -a rebuilt/. .

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: OsmusGallery-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
