name: PR APK Build

on:
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rebuild exact v0.9 project
        shell: bash
        run: |
          cat ci/v09_exact_00.bin ci/v09_exact_01.bin ci/v09_exact_02.bin ci/v09_exact_03.bin > /tmp/OsmusGallery_v0.9.zip
          test "$(wc -c < /tmp/OsmusGallery_v0.9.zip)" -eq 52913
          rm -rf project
          mkdir project
          unzip -q /tmp/OsmusGallery_v0.9.zip "app/*" "build.gradle.kts" "settings.gradle.kts" "gradle.properties" "gradle/*" -d project
          cp -a project/. .
          sed -i 's/import androidx.compose.ui.input.pointer.calculatePan/import androidx.compose.foundation.gestures.calculatePan/' app/src/main/java/com/osmus/gallery/ui/ViewerScreen.kt
          sed -i 's/import androidx.compose.ui.input.pointer.calculateZoom/import androidx.compose.foundation.gestures.calculateZoom/' app/src/main/java/com/osmus/gallery/ui/ViewerScreen.kt
          sed -i '/vm.onHideFinished(success)/d' app/src/main/java/com/osmus/gallery/MainActivity.kt
          sed -i 's/\.pointerInput(item.id, scale)/.pointerInput(item.id)/' app/src/main/java/com/osmus/gallery/ui/ViewerScreen.kt
          python3 - <<'PY'
          from pathlib import Path
          p = Path("app/src/main/java/com/osmus/gallery/ui/ViewerScreen.kt")
          s = p.read_text()
          s = s.replace(".pointerInput(item.id, scale) {", ".pointerInput(item.id) {")
          s = s.replace("coerceIn(1f, 16f)", "coerceIn(1f, 32f)")
          needle = """                    } while (event.changes.any { it.pressed })
                }
            }
    ) {"""
          repl = """                    } while (event.changes.any { it.pressed })
                    if (scale <= 1.15f) {
                        scale = 1f
                        offset = Offset.Zero
                    }
                }
            }
    ) {"""
          if needle not in s:
              raise SystemExit("Viewer gesture block not found")
          s = s.replace(needle, repl, 1)
          p.write_text(s)

          for rel in [
              "app/src/main/java/com/osmus/gallery/ui/GridScreens.kt",
              "app/src/main/java/com/osmus/gallery/MainActivity.kt",
          ]:
              p = Path(rel)
              s = p.read_text()
              s = s.replace('"Nascosti"', '"VAULT"')
              s = s.replace("Cassaforte", "VAULT")
              p.write_text(s)
          PY

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: OsmusGallery-v0.9.8-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

# trigger v0.9.8 verification
