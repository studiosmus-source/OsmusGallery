name: PR APK Build

on:
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rebuild exact v0.9 project
        shell: bash
        run: |
          cat ci/v09_exact_00.bin ci/v09_exact_01.bin ci/v09_exact_02.bin ci/v09_exact_03.bin > /tmp/OsmusGallery_v0.9.zip
          test "$(wc -c < /tmp/OsmusGallery_v0.9.zip)" -eq 52913
          unzip -t /tmp/OsmusGallery_v0.9.zip
          rm -rf project
          mkdir project
          unzip -q /tmp/OsmusGallery_v0.9.zip -d project
          cp -a project/. .

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: OsmusGallery-v0.9.3-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

# trigger v0.9.3 verification
