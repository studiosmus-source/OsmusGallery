name: PR APK Build

on:
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract base project
        shell: bash
        run: |
          rm -rf rebuilt
          unzip -q OsmusGallery_v0.5.1_compilefix.zip -d rebuilt
          cp -a rebuilt/. .

      - name: Rebuild and apply v0.9 patch
        shell: bash
        run: |
          cat ci/v09_chunk_00.b64 ci/v09_chunk_01.b64 ci/v09_chunk_02.b64 | base64 -d > /tmp/v09_patch.zip
          unzip -t /tmp/v09_patch.zip
          unzip -qo /tmp/v09_patch.zip -d .

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: OsmusGallery-v0.9-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
